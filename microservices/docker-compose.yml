version: "3.9"

services:
  gateway:
    build: ./gateway
    ports: ["8000:8000"]
    env_file: 
      - ./gateway/.env.example
    depends_on: 
      auth: { condition: service_healthy }
      weather: { condition: service_healthy }
      advisory: { condition: service_healthy }
      translation: { condition: service_healthy }
    restart: unless-stopped
    networks: ["ms-net"]

  auth:
    build: ./auth
    environment:
      - PORT=8001
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_in_prod_32chars!!}
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=production
    env_file: 
      - ../.env
    restart: unless-stopped
    networks: ["ms-net"]

  weather:
    build: ./weather
    env_file: ./weather/.env.example
    restart: unless-stopped
    networks: ["ms-net"]

  advisory:
    build: ./advisory
    env_file: ./advisory/.env.example
    restart: unless-stopped
    networks: ["ms-net"]

  translation:
    build: ./translation
    env_file: ./translation/.env.example
    restart: unless-stopped
    networks: ["ms-net"]

  notification:
    build: ./notification
    env_file: ./notification/.env.example
    depends_on: 
      redis: { condition: service_started }
      translation: { condition: service_healthy }
    restart: unless-stopped
    networks: ["ms-net"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: ["ms-net"]

  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    restart: unless-stopped
    networks: ["ms-net"]

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: unless-stopped
    networks: ["ms-net"]

networks:
  ms-net:
