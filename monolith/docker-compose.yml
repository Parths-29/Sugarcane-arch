version: "3.9"
services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_in_prod_32chars!!}
      - JWT_EXPIRES_IN=7d
      - WEATHER_CACHE_TTL_MS=600000
      - NODE_ENV=production
    env_file:
      - ../.env
    restart: unless-stopped
    networks:
      - monolith-net

networks:
  monolith-net:
