version: "3.9"

services:
  # Presentation tier – nginx serving built frontend + proxying /api
  presentation:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./presentation/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      logic:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - three-tier-net

  # Logic tier – Express REST API
  logic:
    build: ./logic
    expose:
      - "4001"
    environment:
      - PORT=4001
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_in_prod_32chars!!}
      - JWT_EXPIRES_IN=7d
      - WEATHER_CACHE_TTL_MS=600000
      - NODE_ENV=production
    env_file:
      - ../.env
    restart: unless-stopped
    networks:
      - three-tier-net

networks:
  three-tier-net:
